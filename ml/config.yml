video:
  fps: 1.0
  max_side: 960
  max_frames: 150         # a 145 s clip stays at ~1 fps; longer clips are sampled sparser

detectors:
  # Closed-set COCO detector: reliable people / laptops / bags (hallway reflections score < 0.6).
  - backend: rtdetr
    model: PekingU/rtdetr_r50vd_coco_o365
    device: auto            # auto | cpu | mps | cuda
    batch_size: 4
    score_threshold: 0.55         # a seated cashier seen from the front scores 0.70-0.75; corridor silhouettes (0.44-0.57) are removed by the glass geometry
    # Personal items / drinks score lower than people (handbag 0.44-0.66, cup 0.3-0.5 on the dataset;
    # the desk phone reaches 0.30 as "handbag"): per-group thresholds.
    group_thresholds:
      monitor: 0.45         # a tilted laptop lid scores ~0.6-0.75 once the cashier is gone; monitors have no "ghosts"
      personal_item: 0.4
      drink: 0.35
    queries:
      person: ["person"]
      monitor: ["laptop", "tv"]
      bag: ["suitcase"]   # handbag / backpack are the cashier's personal items, not a cash bag
      personal_item: ["handbag", "backpack"]
      drink: ["cup", "bottle", "wine glass"]
  # Open-vocabulary detector for things COCO has no class for.
  - backend: owlv2
    model: google/owlv2-base-patch16-ensemble
    device: auto
    batch_size: 4
    frame_stride: 2           # OWLv2 is the slowest stage (~0.35 s/frame); its targets are static, so every 2nd second is enough
    score_threshold: 0.27
    group_thresholds:
      personal_item: 0.33   # a worn jacket scores up to 0.28, a handbag on the desk 0.35-0.46
      drink: 0.3
    queries:
      cash: ["a bundle of banknotes", "a stack of paper money", "cash"]
      bag: ["a green bag", "a money bag", "a cash bag", "a pouch", "a document folder", "a paper folder"]
      personal_item: ["a handbag", "a purse", "a coat", "a jacket"]
      drink: ["a coffee cup", "a paper cup", "a mug"]
      glass: ["a glass wall", "a glass partition", "a glass door"]   # calibrates zones.door / zones.glass per video

screen:
  enabled: true
  clip_model: openai/clip-vit-base-patch32
  # Few-shot mode: CLIP embeddings of labelled laptop crops (prototypes/screen_spans.yml -> scripts/build_prototypes.py).
  # Remove `prototypes` to fall back to the zero-shot text prompts below.
  prototypes: prototypes/screen.npz
  knn_k: 5
  min_similarity: 0.7
  panel_fraction: 1.0
  min_luminance: 55
  prompts:
    lock_screen: ["a computer lock screen", "a login screen with a password field", "a screensaver"]
    application: ["a desktop application window with tables and text", "banking software on a computer screen", "a spreadsheet on a screen"]

# Open/closed state of static objects: few-shot k-NN over CLIP embeddings of labelled crops
# (prototypes/<name>_spans.yml -> scripts/build_prototypes.py --target <name>). `embedding: spatial` compares the
# 7x7 grid of CLIP patch embeddings instead of the global vector: a swung door is a local change that the global
# embedding averages away. The crop is located once per video: OWLv2 median box of `anchor.queries` (padded by
# `anchor.pad`), or `anchor.fallback_box` when there are too few hits.
# Safe states: open (door swung, nobody at it), attended (door open, a hand / person handling it), closed;
# only `open` becomes a safe_open observation, so loading the safe is not "left open".
safe:
  enabled: true
  prototypes: prototypes/safe.npz
  embedding: spatial
  knn_k: 1
  min_similarity: 0.5
  smooth_frames: 3
  anchor:
    # Each prompt also fires on the white pedestals; candidates are verified against the safe prototypes (min_similarity).
    queries: ["a gray metal cabinet", "a safe", "a small gray cabinet"]
    score_threshold: 0.12
    stride: 5
    min_hits: 3
    min_similarity: 0.5
    pad: 0.0
    fallback_box: [0.36, 0.25, 0.66, 0.50]

door:
  enabled: true
  prototypes: prototypes/door.npz
  embedding: spatial
  knn_k: 1
  min_similarity: 0.8         # measured: same framing as the prototypes 0.91-0.99, other framings/rooms 0.70-0.77 -> abstain
  smooth_frames: 3
  anchor:
    # OWLv2 cannot localise the door panel on this footage ("a glass door" latches onto the neighbouring glass-wall
    # section, "a door frame" scores ~0.1): the crop is the fixed top-left region that holds the door in every framing.
    queries: []
    fallback_box: [0.03, 0.0, 0.42, 0.50]

# Distances are in units of frame height (x is scaled by width/height), so they survive
# different camera positions; the cashier/desk/safe zones are derived from detections.
# Roles (pipeline/seat.py): the cashier is the person track that dwells at the desk longest; the seat is where it
# sits at the laptop. Distance to the laptop alone cannot tell the cashier from a client across the desk (both
# 0.10-0.16 from it), so only cashier tracks can be "at the workplace" and the others are visitors.
zones:
  cashier_radius: 0.16      # around the monitor: the cashier working at the laptop (seated or standing next to it)
  desk_radius: 0.30         # around the monitor: desk surface where cash/bags lie
  seat_radius: 0.08         # around the seat: the cashier on her chair; also how close a re-tracked person must settle
                            # to become the cashier again (a client stands >= 0.14 from the seat; the door is ~0.1 above it)
  seat_settle_sec: 2.0      # a re-tracked person must stay at the seat this long (walking past it on the way out is not settling)
  safe_radius: 0.18         # around an open safe: person "at the safe"
  # Fallback polygons (normalized), used when the glazing is not detected; pick coordinates with scripts/extract_frame.py.
  door: [[0.0, 0.0], [0.50, 0.0], [0.50, 0.45], [0.0, 0.55]]   # entrance area: door opening + glass wall
  glass: [[0.0, 0.0], [0.22, 0.0], [0.22, 0.55], [0.0, 0.55]]  # glass pane at the frame edge: reflections / corridor people
  # Per-video calibration from the OWLv2 `glass` boxes: the whole glazing becomes `door`, the pane touching the
  # frame edge (where the mirror images live) becomes `glass`. Camera angle moves that pane edge between x=0.24 and 0.35.
  glass_detection:
    enabled: true
    min_frames: 3
    edge_pane_max_fraction: 0.75
    pad: 0.02

person_verifier:
  # CLIP vote on each person crop; a majority "reflection"/"outside" vote vetoes a mid-video track (never promotes).
  enabled: true
  prompts:
    inside: ["a person standing inside an office room", "a person walking into the room", "a person at a desk in an office"]
    reflection: ["a reflection of a person in a glass wall", "a faint mirrored silhouette on glass"]
    outside: ["a person behind a glass wall", "a person seen through a glass partition in a corridor"]

tracking:
  iou_threshold: 0.2
  max_missing_sec: 2.0
  reflection_corr: 0.8        # |velocity correlation| per axis (mirrored sign allowed) to call a track a reflection
  reflection_min_steps: 3     # common moving steps required (3 s at 1 fps)
  reflection_min_motion: 0.05 # total displacement in normalized units; static pairs are never compared
  edge_margin: 0.06           # tracks confined to the glass strip / this edge band are reflections or people outside
  inside_vote_ratio: 0.5

# Action understanding for the "Деньги без проверки" family: a small VLM answers yes/no questions about
# 3-frame windows cropped to the desk; rules combine its answers with the person timeline.
# Off by default: on the open set Qwen3-VL-2B answers "machine_counting: yes" for nearly every window and
# misses client-side actions (cash / ID handover), so only collector_handover_unverified and
# unrecounted_cash_to_safe fire where labelled while no_client_identification false-fires; it also adds
# ~5-7 s per window (~29 windows on a 145 s clip) on a shared M1 Pro GPU. Enable for experiments only.
vlm:
  enabled: false
  model: Qwen/Qwen3-VL-2B-Instruct   # Apache-2.0; HuggingFaceTB/SmolVLM2-500M-Video-Instruct (Apache-2.0) is the light fallback
  device: auto
  mode: json                # json: full JSON answer (~70 tokens); list: short key list (~3x cheaper, noisier); yes_no: 7 forward passes per window
  stride_sec: 5
  window_sec: 6
  frames_per_window: 3
  max_side: 640
  crop_margin: 0.08
  min_crop_height: 0.5
  max_new_tokens: 120
  min_confidence: 0.5
  require_person_near_desk: true

rules:
  # The five "Деньги без проверки" rules only react to VLM action observations; they are no-ops while vlm.enabled is false.
  enabled: [workstation_unlocked, valuables_left_unattended, safe_left_open, cash_room_door_open, unauthorized_entry, cash_exposed_to_visitor,
            personal_items_at_workplace, food_drink_at_workplace,
            cash_not_machine_verified, no_client_identification, unrecounted_cash_to_safe, collector_handover_unverified, counting_not_in_client_presence]
  door_state_trusted: true    # door_open comes from the few-shot door classifier (`door:` above), not from zero-shot detection
  seat_core_radius: 0.10      # timecode of an absence = last second the cashier was this close to the seat
  departure_lookback_sec: 6
  unattended_sec: 3
  safe_open_sec: 4
  door_open_sec: 4
  personal_items_sec: 4
  food_drink_sec: 4
  min_presence_sec: 3
  merge_gap_sec: 10
  max_events: 5
  # VLM-action rules (no-ops while vlm.enabled is false)
  machine_lookaround_sec: 15
  recount_lookback_sec: 60
  collector_leave_sec: 12
  client_gone_sec: 3

evidence:
  frames: 3
  max_side: 640
  jpeg_quality: 80
  draw_boxes: true
