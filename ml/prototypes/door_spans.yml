# Labelled time spans used to build CLIP prototypes for the cash-room door classifier (open / closed).
# The crop is the fixed top-left region of config `door.anchor.fallback_box` (glass wall with the door panel).
# Closed: the panel is flush with the glass wall, handle at its right edge. Open: the panel is swung into the room,
# seen edge-on as a thick post in the middle of the wall. Seconds where the panel is mid-swing are left out.
# `step` thins long static spans. Spans were chosen by looking at the crops (scripts/build_prototypes.py --target door --sheet <dir> --videos ...).
videos_dir: ~/Downloads/open/videos
spans:
  - {video: X-32, start: 5,  end: 21,  label: open}        # door left open after entering
  - {video: X-33, start: 6,  end: 14,  label: open}        # door left open, second person walks in
  - {video: X-30, start: 4,  end: 18,  label: open}        # door not closed, a man walks in at 13
  - {video: X-31, start: 7,  end: 9,   label: open}        # opened, then closed again at 10-11
  - {video: X-25, start: 26, end: 28,  label: open}        # teller walks out
  - {video: X-32, start: 0,  end: 2,   label: closed}
  - {video: X-33, start: 0,  end: 2,   label: closed}
  - {video: X-30, start: 0,  end: 1,   label: closed}
  - {video: X-31, start: 0,  end: 5,   label: closed}
  - {video: X-31, start: 12, end: 23,  step: 2, label: closed}
  - {video: X-25, start: 0,  end: 24,  step: 2, label: closed}      # teller stands in front of the door for long stretches
  - {video: X-25, start: 30, end: 31,  label: closed}
  - {video: X-21, start: 0,  end: 19,  step: 2, label: closed}      # framing shifted left
  - {video: X-20, start: 0,  end: 11,  label: closed}
  - {video: X-12, start: 0,  end: 35,  step: 2, label: closed}      # tilted framing, lights go off at 33
