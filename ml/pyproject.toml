[project]
name = "cashguard-ml"
version = "0.1.0"
description = "CashGuard ML service: local video analysis of cashier workplace violations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "opencv-python-headless>=4.10",
    "pillow>=10.3",
    "torch>=2.3",
    "transformers>=4.44",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*", "rules*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
